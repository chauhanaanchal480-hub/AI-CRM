services:
  db:
    image: postgres:16-alpine
    container_name: crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: crm_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crm_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &api_environment
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_ENCRYPTED: ${DATABASE_URL_ENCRYPTED:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
      RETENTION_DATABASE_URL: ${RETENTION_DATABASE_URL:?RETENTION_DATABASE_URL is required}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      REDIS_URL_ENCRYPTED: ${REDIS_URL_ENCRYPTED:-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-ai-crm}
      CACHE_DASHBOARD_TTL_SECONDS: ${CACHE_DASHBOARD_TTL_SECONDS:-60}
      CACHE_ANALYTICS_TTL_SECONDS: ${CACHE_ANALYTICS_TTL_SECONDS:-300}
      CACHE_ENTITY_TTL_SECONDS: ${CACHE_ENTITY_TTL_SECONDS:-120}
      CACHE_AI_TTL_SECONDS: ${CACHE_AI_TTL_SECONDS:-900}
      QUEUE_DEFAULT_ATTEMPTS: ${QUEUE_DEFAULT_ATTEMPTS:-5}
      QUEUE_WORKER_CONCURRENCY: ${QUEUE_WORKER_CONCURRENCY:-5}
      QUEUE_JOB_TIMEOUT_MS: ${QUEUE_JOB_TIMEOUT_MS:-120000}
      EXPORT_BATCH_SIZE: ${EXPORT_BATCH_SIZE:-500}
      EXPORT_DIR: ${EXPORT_DIR:-exports}
      RESPONSE_COMPRESSION_THRESHOLD_BYTES: ${RESPONSE_COMPRESSION_THRESHOLD_BYTES:-1024}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?ENCRYPTION_KEYS is required}
      ENCRYPTION_CURRENT_KEY_ID: ${ENCRYPTION_CURRENT_KEY_ID:?ENCRYPTION_CURRENT_KEY_ID is required}
      FIELD_ENCRYPTION_ENABLED: ${FIELD_ENCRYPTION_ENABLED:-true}
      FIELD_SEARCH_KEY: ${FIELD_SEARCH_KEY:?FIELD_SEARCH_KEY is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      API_HMAC_KEYS: ${API_HMAC_KEYS:-}
      API_HMAC_REQUIRED: ${API_HMAC_REQUIRED:-false}
      API_HMAC_CLOCK_SKEW_SECONDS: ${API_HMAC_CLOCK_SKEW_SECONDS:-300}
      API_IDEMPOTENCY_TTL_HOURS: ${API_IDEMPOTENCY_TTL_HOURS:-24}
      API_ABUSE_WINDOW_MS: ${API_ABUSE_WINDOW_MS:-300000}
      API_ABUSE_STRIKE_LIMIT: ${API_ABUSE_STRIKE_LIMIT:-100}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX_KEYS: ${RATE_LIMIT_MAX_KEYS:-50000}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-20000}
      RATE_LIMIT_GLOBAL_WINDOW_MS: ${RATE_LIMIT_GLOBAL_WINDOW_MS:-60000}
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-1000}
      RATE_LIMIT_IP_WINDOW_MS: ${RATE_LIMIT_IP_WINDOW_MS:-900000}
      RATE_LIMIT_USER_MAX: ${RATE_LIMIT_USER_MAX:-2000}
      RATE_LIMIT_USER_WINDOW_MS: ${RATE_LIMIT_USER_WINDOW_MS:-900000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-50}
      RATE_LIMIT_LOGIN_WINDOW_MS: ${RATE_LIMIT_LOGIN_WINDOW_MS:-900000}
      RATE_LIMIT_PASSWORD_RESET_MAX: ${RATE_LIMIT_PASSWORD_RESET_MAX:-10}
      RATE_LIMIT_PASSWORD_RESET_WINDOW_MS: ${RATE_LIMIT_PASSWORD_RESET_WINDOW_MS:-3600000}
      RATE_LIMIT_AI_MAX: ${RATE_LIMIT_AI_MAX:-100}
      RATE_LIMIT_AI_WINDOW_MS: ${RATE_LIMIT_AI_WINDOW_MS:-3600000}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-100}
      RATE_LIMIT_UPLOAD_WINDOW_MS: ${RATE_LIMIT_UPLOAD_WINDOW_MS:-3600000}
      RATE_LIMIT_EXPORT_MAX: ${RATE_LIMIT_EXPORT_MAX:-30}
      RATE_LIMIT_EXPORT_WINDOW_MS: ${RATE_LIMIT_EXPORT_WINDOW_MS:-3600000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_KEY_ENCRYPTED: ${ANTHROPIC_API_KEY_ENCRYPTED:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_ENCRYPTED: ${OPENAI_API_KEY_ENCRYPTED:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_ENCRYPTED: ${GEMINI_API_KEY_ENCRYPTED:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
    command: sh -c "node dist/database/secureMigrate.js && node dist/database/encryptionBackfill.js && node dist/server.js"

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crm_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment: *api_environment
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
    command: node dist/worker.js

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Same-origin: nginx in the web container proxies /api to the api service.
        VITE_API_URL: /api
    container_name: crm_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  db_data:
  redis_data:
  uploads_data:
  exports_data:
