map $http_accept_encoding $precompressed_suffix {
    default "";
    ~*br ".br";
    ~*gzip ".gz";
}

map $http_accept_encoding $precompressed_encoding {
    default "";
    ~*br "br";
    ~*gzip "gzip";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime gzip fallback for HTML and any non-precompressed text response.
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively
    # Vite emits Brotli and gzip sidecars for immutable JavaScript/CSS assets.
    location ~* ^/assets/.+\.(?:js|css)$ {
        try_files $uri$precompressed_suffix $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Encoding $precompressed_encoding;
        add_header Vary "Accept-Encoding";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API and uploads to the backend service (docker-compose network)
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://api:4000/uploads/;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
